mode: srv

auth:
  provider: jitsi

room:
  id: "{{ .RoomID }}"

crypto:
  key: "{{ .Key }}"

net:
  transport: datachannel
  dns: "8.8.8.8:53"

liveness:
  interval: 10s
  timeout: 5s
  failures: 3

socks:
  proxy_addr: "127.0.0.1" # например "127.0.0.1"
  proxy_port: 1080 # например 1080
  proxy_user: "" # необязательная auth для upstream-прокси (RFC 1929)
  proxy_pass: ""

data: data
debug: false
